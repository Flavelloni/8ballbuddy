name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set the deployment base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          ruby -ryaml <<'RUBY'
          path = 'site/.kobweb/conf.yaml'
          config = YAML.load_file(path)
          config.fetch('site')['basePath'] = ENV.fetch('PAGES_BASE_PATH').sub(%r{^/}, '')
          File.write(path, YAML.dump(config))
          RUBY

      - name: Use the runner's Chrome for static export
        run: |
          chrome_path="$(command -v google-chrome)"
          echo "KOBWEB_EXPORT_BROWSER_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Export the static website
        env:
          KOBWEB_EXPORT_NUM_THREADS: '1'
        run: |
          chmod +x gradlew
          ./gradlew :site:kobwebExport --no-daemon --stacktrace \
            -PkobwebReuseServer=false \
            -PkobwebEnv=DEV \
            -PkobwebRunLayout=FULLSTACK \
            -PkobwebBuildTarget=RELEASE \
            -PkobwebExportLayout=STATIC

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/.kobweb/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
